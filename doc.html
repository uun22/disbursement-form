<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEMO อนุมัติเบิกแอดวานซ์</title>
<link rel="preconnect" href="https://static.line-scdn.net"><link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
@page{size:A4 portrait;margin:12mm}
*{box-sizing:border-box}
body{margin:0;background:#e6e6e6;color:#111;font:13px/1.4 "Sarabun","Noto Sans Thai",system-ui,sans-serif}
.bar{position:sticky;top:0;z-index:9;background:#222;color:#fff;padding:8px 12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:14px}
.bar button{border:0;border-radius:18px;padding:8px 18px;font:inherit;font-weight:700;background:#2e3388;color:#fff;cursor:pointer}
.bar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.bar small{color:#bbb}
#msg{max-width:210mm;margin:14px auto;padding:10px 14px;background:#fff3cd;color:#664d03;border-radius:10px}
.sheet{position:relative;width:210mm;margin:12px auto;background:#fff;padding:12mm;box-shadow:0 2px 10px #0003;overflow:hidden}
.hidden{display:none!important}
.wm{position:absolute;left:0;right:0;top:75mm;text-align:center;font-size:64px;font-weight:700;color:rgba(200,0,0,.16);transform:rotate(-24deg);pointer-events:none;letter-spacing:2px}
.head{display:grid;grid-template-columns:34mm 1fr 40mm;align-items:center;margin-bottom:4mm}
.logo{font-weight:700;font-size:30px;letter-spacing:-1px}
.logo img{max-height:16mm;max-width:32mm;display:block}
.title{text-align:center;font-weight:700;font-size:15px}
.docno{text-align:right;font-weight:700;font-size:15px}
.meta{display:grid;grid-template-columns:1.25fr 1fr;gap:10mm;margin-bottom:4mm}
.meta .row{display:flex;gap:4px;border-bottom:1px solid #333;padding:2px 0;min-height:7mm;align-items:flex-end}
.meta .row b{white-space:nowrap;font-weight:600}
.meta .note{font-size:9px;color:#555;margin-top:2px}
.cap{font-weight:700;text-align:center;margin:3mm 0 1.5mm}
table{border-collapse:collapse;width:100%}
.items th,.items td{border:1px solid #333;padding:3px 5px;vertical-align:top}
.items th{font-weight:600;text-align:center;background:#fff}
.items th small{display:block;font-weight:400;font-size:9px}
.items td.n{text-align:right;white-space:nowrap}
.items td.c{text-align:center;white-space:nowrap}
.items td.rm{font-size:10.5px;word-break:keep-all;overflow-wrap:anywhere}
.items tr.tot td{font-weight:700}
.items tr.tot td.lbl{text-align:center;border-left:0;border-bottom:1px solid #333}
.pays{margin-top:5mm}
.pays .cap{text-align:left;margin:0 0 2mm 8mm}
.pay{display:grid;grid-template-columns:6mm 19mm 22mm 22mm 18mm 21mm 1fr;gap:3px;border-bottom:1px solid #333;padding:2px 0;align-items:baseline}
.pay .amt{text-align:right;font-weight:600}.pay span:last-child{font-size:10.5px}
.sign{margin-top:8mm;width:140mm}
.sign th,.sign td{border:1px solid #333;padding:2px 6px}
.sign th{text-align:center;font-weight:600}
.sign td{height:11mm;vertical-align:middle}
.sign td.d{text-align:center;white-space:nowrap}.sign .sys{font-size:8.5px}
.sign .pend{color:#888}
.sign .sys{display:block;font-size:9px;color:#666}
.sysoff .sys{display:none}
@media screen and (max-width:820px){.sheet,#msg{zoom:.46;width:210mm}#msg{zoom:1;width:auto;margin:10px}}
.dlg{position:fixed;inset:0;z-index:20;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px}
.dlg .box{background:#fff;color:#111;border-radius:16px;padding:18px;max-width:380px;width:100%;font-size:15px}
.dlg p{margin:10px 0 16px;line-height:1.5;color:#333}.dlg .acts{display:flex;gap:10px;justify-content:flex-end}
.dlg button{border:0;border-radius:18px;padding:9px 18px;font:inherit;font-weight:700;background:#2e3388;color:#fff}.dlg button.ghost{background:#e8e8e8;color:#111}
@media print{.dlg{display:none!important}body{background:#fff}.bar,#msg{display:none!important}.sheet{margin:0;box-shadow:none;width:auto;padding:0}}
</style></head><body>
<div class="bar" id="bar">
  <button id="printBtn">พิมพ์ / บันทึก PDF</button>
  <label><input type="checkbox" id="sysChk" checked> แสดงข้อความ "อนุมัติผ่านระบบ" ในช่องลงนาม</label>
  <small id="perf"></small>
</div>
<div id="dlg" class="dlg hidden"><div class="box"><b id="dlgT"></b><p id="dlgB"></p><div class="acts"><button id="dlgNo" class="ghost">ยกเลิก</button><button id="dlgYes"></button></div></div></div>
<div id="msg">กำลังโหลดเอกสาร...</div>
<div class="sheet hidden" id="sheet">
  <div class="wm" id="wm"></div>
  <div class="head">
    <div class="logo" id="logo"><img src="logo.png" alt="iGET" onerror="this.parentNode.textContent='iGET'"></div>
    <div class="title" id="title"></div>
    <div class="docno" id="docno"></div>
  </div>
  <div class="meta">
    <div>
      <div class="row"><b>DATE :</b><span id="f_date"></span></div>
      <div class="row"><b>NAME :</b><span id="f_name"></span></div>
      <div class="row"><b>CLIENT :</b><span id="f_client"></span></div>
      <div class="row"><b>JOB :</b><span id="f_job"></span></div>
    </div>
    <div>
      <div class="row"><b>Team :</b><span id="f_team"></span></div>
      <div class="row"><b>Job No :</b><span id="f_jobno"></span></div>
      <div class="row"><b>Period :</b><span id="f_period"></span></div>
    </div>
  </div>
  <div class="cap">ขออนุมัติเบิกแอดวานซ์ตามรายการ ดังนี้</div>
  <table class="items">
    <thead><tr><th style="width:17mm">วันที่</th><th>รายละเอียดการเบิกค่าใช้จ่าย</th><th style="width:22mm">ยอดก่อน VAT</th><th style="width:19mm">VAT 7%</th><th style="width:19mm">หัก ณ ที่จ่าย<small>1%, 2%, 3%, 5%</small></th><th style="width:22mm">สุทธิ</th><th style="width:58mm">หมายเหตุ</th></tr></thead>
    <tbody id="items"></tbody>
  </table>
  <div class="pays"><div class="cap">โดยขออนุมัติเบิกตาม วันที่ ดังนี้</div><div id="pays"></div></div>
  <table class="sign" id="sign"><thead><tr><th>ชื่อ / สกุล / ตำแหน่ง</th><th style="width:42mm">ลายเซ็นต์รับทราบ</th><th style="width:24mm">วันที่</th></tr></thead><tbody id="signb"></tbody></table>
</div>
<script>
var CONFIG={API_URL:'https://script.google.com/macros/s/AKfycbxkPNj6mHUUpoZEvRR48KZqkfFtUfsHmjkd9LQy2pK0PiP-BctTRmT4HVPC_HJTeonV/exec',LIFF_ID:'2012297955-JASH9Xp6'};   // LIFF ตัวที่ 2 (Endpoint = doc.html) — ต้องตั้ง DOC_LIFF_ID ใน Script Properties เป็นค่าเดียวกัน
var DOC_LIFF=CONFIG.LIFF_ID!=='2012297955-xttcMKSR';   // true เมื่อใช้ LIFF ตัวที่ 2
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function num(x){return Number(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function nz(x){return Number(x)?num(x):''}      // 0 แสดงเป็นช่องว่างเหมือนเมโมจริง

function render(d){
  $('title').textContent='MEMO อนุมัติเบิกแอดวานซ์  ครั้งที่ '+d.seq;
  $('docno').textContent=d.doc_no;
  $('f_date').textContent=d.date;$('f_name').textContent=d.requester;$('f_client').textContent=d.customer;$('f_job').textContent=d.job_detail;
  $('f_team').textContent=d.team;$('f_jobno').textContent=d.job_no;$('f_period').textContent=d.period;
  $('items').innerHTML=d.lines.map(function(L){
    return '<tr><td class="c">'+esc(L.date)+'</td><td>'+esc(L.desc)+'</td><td class="n">'+num(L.base)+'</td><td class="n">'+nz(L.vat)+'</td><td class="n">'+nz(L.wht)+'</td><td class="n">'+num(L.net)+'</td><td class="rm">'+esc(L.bank)+' / '+esc(L.account)+' / '+esc(L.payee)+'</td></tr>'}).join('')+
   '<tr class="tot"><td colspan="2" class="lbl">รวมค่าใช้จ่ายทั้งสิ้น</td><td class="n">'+num(d.totals.base)+'</td><td class="n">'+nz(d.totals.vat)+'</td><td class="n">'+nz(d.totals.wht)+'</td><td class="n">'+num(d.totals.net)+'</td><td></td></tr>';
  $('pays').innerHTML=d.lines.map(function(L,i){
    return '<div class="pay"><span>'+(i+1)+'</span><span>จำนวนเงิน</span><span class="amt">'+num(L.net)+'</span><span>รับยอดวันที่</span><span>'+esc(L.pay_date)+'</span><span>&gt; ผู้รับเงิน</span><span>'+esc(L.bank)+' / '+esc(L.account)+' / '+esc(L.payee)+'</span></div>'}).join('');
  $('signb').innerHTML=d.approvals.map(function(a){
    var done=(a.state==='approved'||a.state==='requester'),rej=a.state==='rejected';
    var who=a.name?(done||rej?'คุณ'+esc(a.name):'<span class="pend">คุณ'+esc(a.name)+'</span>'):'';
    var sys=a.state==='approved'?'<span class="sys">อนุมัติผ่านระบบ</span>':a.state==='requester'?'<span class="sys">ส่งคำขอผ่านระบบ</span>':rej?'<span class="sys">ไม่อนุมัติ</span>':'';
    return '<tr><td>'+who+(who?' / ':'')+esc(a.role)+'</td><td>'+sys+'</td><td class="d">'+esc(a.date)+'</td></tr>'}).join('');
  var wm=$('wm');
  if(d.status==='APPROVED')wm.classList.add('hidden');
  else{wm.classList.remove('hidden');wm.textContent=d.status==='REJECTED'?'ไม่อนุมัติ':d.status==='CANCELLED'?'ยกเลิก':'ยังไม่อนุมัติครบ'}
  document.title=d.doc_no+' MEMO อนุมัติเบิกแอดวานซ์';
  $('msg').classList.add('hidden');$('sheet').classList.remove('hidden');clearInterval(TICK);
}
var T0=Date.now(),STAGE='เริ่มต้น',TICK=setInterval(function(){var m=$('msg');if(m.classList.contains('hidden')||m.dataset.err){return}
  var s=Math.round((Date.now()-T0)/1000);m.textContent='กำลังโหลดเอกสาร... ('+STAGE+' '+s+' วินาที)'+(s>25?' ใช้เวลานานผิดปกติ ลองปิดแล้วเปิดใหม่จากปุ่ม ดูเอกสาร':'')},1000);
function fail(t){$('msg').dataset.err='1';$('msg').textContent=t;$('msg').classList.remove('hidden')}
function noAccess(){   // บัญชี LINE ที่ล็อกอินไม่ได้ลงทะเบียน/ยังไม่ active ในชีท Users
  var m=$('msg');m.classList.remove('hidden');m.innerHTML='';
  var t=document.createElement('div');t.textContent='บัญชี LINE ที่ล็อกอินอยู่ในเบราว์เซอร์นี้ยังไม่ได้เปิดใช้งานในระบบ อาจล็อกอินคนละบัญชีกับที่ใช้ในมือถือ';m.appendChild(t);
  if(window.liff&&liff.getProfile){liff.getProfile().then(function(p){var s=document.createElement('div');s.style.marginTop='6px';s.textContent='ตอนนี้ล็อกอินเป็น: '+p.displayName;m.appendChild(s)}).catch(function(){})}
  var b=document.createElement('button');b.textContent='ล็อกอินด้วยบัญชีอื่น';b.style.cssText='margin-top:10px;border:0;border-radius:18px;padding:8px 16px;font:inherit;font-weight:700;background:#2e3388;color:#fff;cursor:pointer';
  b.onclick=function(){liff.logout();location.reload()};m.appendChild(b)}
function ask(t,b,yes,fn){$('dlgT').textContent=t;$('dlgB').textContent=b;$('dlgYes').textContent=yes;$('dlg').classList.remove('hidden');
  $('dlgNo').onclick=function(){$('dlg').classList.add('hidden')};$('dlgYes').onclick=function(){$('dlg').classList.add('hidden');fn()}}
$('printBtn').onclick=function(){
  var inApp=window.liff&&liff.isInClient&&liff.isInClient();
  if(inApp){
    var doc=new URLSearchParams(location.search).get('doc')||'';
    ask('เปิดในเบราว์เซอร์เพื่อพิมพ์','แอป LINE สั่งพิมพ์โดยตรงไม่ได้ ระบบจะเปิดเอกสารนี้ในเบราว์เซอร์ภายนอก (ครั้งแรกอาจต้องล็อกอิน LINE) จากนั้นกดปุ่ม พิมพ์ / บันทึก PDF อีกครั้ง','เปิดในเบราว์เซอร์',function(){
      liff.openWindow({url:'https://liff.line.me/'+CONFIG.LIFF_ID+(DOC_LIFF?'?doc=':'/doc.html?doc=')+encodeURIComponent(doc),external:true})})
  }else{
    ask('พิมพ์เอกสาร','ตั้งค่ากระดาษเป็น A4 แนวตั้ง ขนาด 100% และปิด Headers and footers เพื่อให้ตรงกับใบเมโมจริง หรือเลือกปลายทางเป็น บันทึกเป็น PDF','พิมพ์',function(){window.print()})
  }};
$('sysChk').onchange=function(){$('sheet').classList.toggle('sysoff',!this.checked)};

function post(body){
  return fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)}).then(function(r){
    return r.text().then(function(t){try{return JSON.parse(t)}catch(e){throw new Error('ตอบกลับไม่ใช่ JSON ('+r.status+')')}})})
}
function load(token){
  var doc=new URLSearchParams(location.search).get('doc');
  if(!doc){fail('ไม่พบเลขที่เอกสาร');return}
  STAGE='ดึงข้อมูลจากระบบ';var tq=Date.now();
  post({action:'doc',doc_no:doc,id_token:token}).then(function(j){
    if(!j.ok)throw new Error(j.error||'โหลดเอกสารไม่สำเร็จ');render(j.doc);
    $('perf').textContent='โหลดทั้งหมด '+((Date.now()-T0)/1000).toFixed(1)+' วิ (ดึงข้อมูล '+((Date.now()-tq)/1000).toFixed(1)+' วิ, ระบบ '+(j.ms||0)+' มิลลิวินาที'+(j.cached?', จากแคช':'')+')'
  }).catch(function(e){if(e.message==='ไม่มีสิทธิ์ใช้งาน')noAccess();else fail('เปิดเอกสารไม่ได้: '+e.message)})
}
function demo(){   // ข้อมูลสมมติ ใช้ดูหน้าตาเอกสารโดยไม่ต้องล็อกอิน: doc.html?demo=1
  render({doc_no:'OE6900000',status:'PENDING',seq:1,date:'06/11/2026',requester:'ผู้ขอ ตัวอย่าง',customer:'บริษัท ตัวอย่าง จำกัด',job_detail:'งานตัวอย่าง Event 2026',
   job_no:'DEMO 260101',team:'K.Sample',period:'16 Sep 2026',
   lines:[{date:'24-09-26',desc:'ค่าผลิตงานโครงสร้างบูธ+เซทอัพ',base:10000,vat:0,wht:300,net:9700,payee:'บจก. ทดสอบ โปรดักชั่น',bank:'ธ.กสิกรไทย',account:'000-0-00001-0',pay_date:'24-09-26'},
          {date:'24-09-26',desc:'ค่า Truss',base:17000,vat:0,wht:510,net:16490,payee:'นายทดสอบ หนึ่ง',bank:'ธ.ทหารไทยธนชาต',account:'000-0-00003-0',pay_date:'24-09-26'},
          {date:'24-09-26',desc:'Photography+VDO',base:14000,vat:980,wht:420,net:14560,payee:'บจก. ทดสอบ ถ่ายภาพ+วิดีโอ',bank:'ธ.กสิกรไทย',account:'000-0-00007-0',pay_date:'01-10-26'}],
   totals:{base:41000,vat:980,wht:1230,net:40750},
   approvals:[{role:'ผู้เบิก / ผู้จัดทำเอกสาร',name:'ผู้ขอ ตัวอย่าง',date:'06/11/26',state:'requester'},{role:'หัวหน้างาน',name:'หัวหน้า ตัวอย่าง',date:'06/11/26',state:'approved'},
     {role:'เจ้าของงาน',name:'เจ้าของ ตัวอย่าง',date:'',state:'pending'},{role:'ฝ่ายบัญชี-การเงิน',name:'บัญชี ตัวอย่าง',date:'',state:'pending'},{role:'ผู้ตรวจสอบ',name:'ผู้ตรวจ ตัวอย่าง',date:'',state:'pending'},{role:'ผู้อนุมัติจ่าย',name:'ผู้จ่าย ตัวอย่าง',date:'',state:'pending'}]})
}
(function boot(){
  if(new URLSearchParams(location.search).get('demo')==='1'){demo();return}
  STAGE='โหลด LINE SDK';var s=document.createElement('script');s.src='https://static.line-scdn.net/liff/edge/2/sdk.js';
  s.onload=function(){STAGE='เชื่อมต่อ LIFF';liff.init({liffId:CONFIG.LIFF_ID}).then(function(){
    if(!liff.isLoggedIn()){   // กันวนล็อกอินไม่รู้จบ: ลองได้ไม่เกิน 2 ครั้งใน 2 นาที
      var t=JSON.parse(sessionStorage.getItem('loginTry')||'[]').filter(function(x){return Date.now()-x<120000});
      if(t.length>=2){fail('ล็อกอินไม่สำเร็จซ้ำหลายครั้ง กรุณาปิดหน้านี้แล้วเปิดใหม่จากปุ่ม ดูเอกสาร ในแชท LINE');return}
      t.push(Date.now());sessionStorage.setItem('loginTry',JSON.stringify(t));STAGE='ล็อกอิน LINE';liff.login();return}
    load(liff.getIDToken())
  }).catch(function(e){fail('LIFF error: '+e.message)})};
  s.onerror=function(){fail('โหลด LINE SDK ไม่ได้')};
  document.head.appendChild(s)
})();
</script></body></html>
